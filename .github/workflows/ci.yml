name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Benchmark (offline)
        run: derivcheck bench
      - name: Examples
        run: |
          derivcheck examples/relativistic_limit.tex -o /tmp/r.json
          derivcheck examples/harmonic_oscillator.tex -o /tmp/h.json
          # the example with an error must be caught (exit code 1)
          set +e
          derivcheck examples/kinetic_energy_error.tex -o /tmp/k.json
          test $? -eq 1
